name: Seaport Test CI

on:
  push:
    branches: [main, 1.*, 2.*]
    tags: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]

# A new push to a pull request cancels its older run. Every other run gets
# its own group, so no run on a branch or tag is cancelled while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.9.0

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build

  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The tools are pinned by version and SHA-256 in the install script, so
      # the cache only skips downloads.
      - name: Restore tools
        uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-tools.sh') }}

      - name: Install tools
        run: |
          scripts/install-tools.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Check deployed contract sources are unchanged
        run: shasum -a 256 --check --quiet scripts/frozen-contracts.sha256

      - name: Check Solidity formatting
        run: forge fmt --check contracts test script reference

      - name: Lint Solidity
        run: forge lint --deny warnings

      - name: Check formatting and lint with Biome
        run: biome ci .

      - name: Check TOML formatting
        run: taplo fmt --check

      - name: Lint shell scripts
        run: |
          shellcheck scripts/*.sh templates/*.sh
          shfmt -d scripts/*.sh templates/*.sh

      - name: Lint workflows
        run: actionlint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test

  reference-test:
    name: Run Reference Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REFERENCE: true
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn build:ref
      - run: yarn test:ref

  reference-coverage:
    name: Run Reference Coverage Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REFERENCE: true
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn build:ref
      - run: yarn coverage:ref
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          flags: reference
          token: ${{ secrets.CODECOV_TOKEN }}

  # Compiles the reference (via_ir = false) and optimized (via_ir = true)
  # profiles once and caches them. The Forge test jobs restore that cache
  # instead of each spending several minutes rebuilding, and rebuild only if
  # the cache is unavailable.
  forge-build:
    name: Build Forge Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cache-key: ${{ steps.key.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # The key covers every input of the two builds: compiler settings,
      # sources, and each submodule commit (hashFiles can't see gitlinks).
      - name: Compute cache key
        id: key
        run: |
          submodules=$(git submodule status --recursive | sha256sum | cut -c1-16)
          echo "cache-key=forge-precompiled-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml', 'contracts/**', 'reference/**') }}-${submodules}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/forge-precompile
        with:
          cache-key: ${{ steps.key.outputs.cache-key }}
          save: "true"

  forge:
    name: Run Forge Tests (via_ir = true)
    needs: forge-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: ./.github/actions/forge-precompile
        with:
          cache-key: ${{ needs.forge-build.outputs.cache-key }}

      - name: Check the build matches deployed Seaport 1.6
        env:
          FOUNDRY_PROFILE: test
        run: forge test --match-path test/foundry/DeployedBytecode.t.sol -vvv

      - name: Run tests
        env:
          FOUNDRY_PROFILE: test
        run: forge test -vvv

  forge-ref:
    name: Run Forge Reference Tests (via_ir = false)
    needs: forge-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: ./.github/actions/forge-precompile
        with:
          cache-key: ${{ needs.forge-build.outputs.cache-key }}

      - name: Run reference tests
        env:
          FOUNDRY_PROFILE: reference
          MOAT_PROFILE: reference
        run: forge test -vvv

  forge-offerers:
    name: Run Contract Offerer Forge Tests (via_ir = false)
    needs: forge-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: ./.github/actions/forge-precompile
        with:
          cache-key: ${{ needs.forge-build.outputs.cache-key }}

      - name: Run tests
        env:
          FOUNDRY_PROFILE: offerers
        run: forge test -vvv

  forge-coverage:
    name: Run Forge Coverage report on tests
    needs: forge-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-foundry
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: ./.github/actions/forge-precompile
        with:
          cache-key: ${{ needs.forge-build.outputs.cache-key }}

      - name: Run coverage with lcov output
        env:
          FOUNDRY_PROFILE: default
          SEAPORT_COVERAGE: true
        run: forge coverage --report lcov

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./lcov.info
          flags: foundry
          token: ${{ secrets.CODECOV_TOKEN }}
