# Install with `scripts/install-tools.sh && .tools/bin/lefthook install`.
pre-commit:
  parallel: true
  jobs:
    - name: forge fmt
      glob: "*.sol"
      exclude:
        - "lib/**"
      run: forge fmt {staged_files}
      stage_fixed: true
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,md,yml,yaml}"
      exclude:
        - "lib/**"
      run: .tools/bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: taplo
      glob: "*.toml"
      exclude:
        - "lib/**"
      run: .tools/bin/taplo fmt {staged_files}
      stage_fixed: true
